<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lit campus pathway at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12263f"/>
      <stop offset="0.7" stop-color="#3b4f7a"/>
      <stop offset="1" stop-color="#e58a5b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- buildings -->
  <rect x="0" y="170" width="220" height="190" fill="#1b2a44"/>
  <rect x="580" y="140" width="220" height="220" fill="#1b2a44"/>
  <rect x="230" y="210" width="130" height="150" fill="#22345a"/>
  <rect x="450" y="220" width="120" height="140" fill="#22345a"/>
  <g fill="#ffd36b">
    <rect x="25" y="200" width="22" height="28"/><rect x="65" y="200" width="22" height="28"/><rect x="105" y="200" width="22" height="28"/>
    <rect x="25" y="250" width="22" height="28"/><rect x="105" y="250" width="22" height="28"/><rect x="145" y="250" width="22" height="28"/>
    <rect x="610" y="175" width="22" height="28"/><rect x="650" y="175" width="22" height="28"/><rect x="730" y="175" width="22" height="28"/>
    <rect x="650" y="225" width="22" height="28"/><rect x="690" y="225" width="22" height="28"/><rect x="730" y="225" width="22" height="28"/>
    <rect x="255" y="240" width="18" height="24"/><rect x="295" y="240" width="18" height="24"/>
  </g>
  <!-- ground and path -->
  <rect y="360" width="800" height="90" fill="#2b5a46"/>
  <polygon points="330,360 470,360 640,450 160,450" fill="#d9d4c7"/>
  <polygon points="390,360 410,360 440,450 360,450" fill="#c4bfb0"/>
  <!-- lamp posts with glow -->
  <g>
    <circle cx="300" cy="300" r="70" fill="url(#glow)"/>
    <rect x="297" y="300" width="6" height="62" fill="#0e1b2e"/>
    <circle cx="300" cy="298" r="9" fill="#fff1b8"/>
    <circle cx="500" cy="300" r="70" fill="url(#glow)"/>
    <rect x="497" y="300" width="6" height="62" fill="#0e1b2e"/>
    <circle cx="500" cy="298" r="9" fill="#fff1b8"/>
    <circle cx="150" cy="330" r="90" fill="url(#glow)"/>
    <rect x="146" y="330" width="8" height="90" fill="#0e1b2e"/>
    <circle cx="150" cy="328" r="12" fill="#fff1b8"/>
    <circle cx="650" cy="330" r="90" fill="url(#glow)"/>
    <rect x="646" y="330" width="8" height="90" fill="#0e1b2e"/>
    <circle cx="650" cy="328" r="12" fill="#fff1b8"/>
  </g>
  <!-- two walkers -->
  <g fill="#0e1b2e">
    <circle cx="385" cy="372" r="7"/><rect x="379" y="380" width="12" height="26" rx="5"/>
    <circle cx="410" cy="372" r="7"/><rect x="404" y="380" width="12" height="26" rx="5"/>
  </g>
</svg>
